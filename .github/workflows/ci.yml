name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev dependencies
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Unit and characterisation tests (offline)
        run: pytest -m "not integration" --cov=src --cov-report=term-missing

  integration-tests:
    # Opt-in only: installs Crawl4AI and Playwright Chromium, then makes
    # live requests to My Planned Care. No API key required.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with dev and crawl dependencies
        run: pip install -e .[dev,crawl]
      - name: Install Playwright browsers
        run: crawl4ai-setup
      - name: Live integration tests
        run: pytest -m integration
