name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev dependencies
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Unit and characterisation tests (offline)
        run: pytest -m "not integration" --cov=src --cov-report=term-missing

  integration-tests:
    # Opt-in only. Crawl4AI runs Playwright in-process, so no API key is
    # required; the backend and its browser setup land in a follow-up PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - name: Live integration tests
        run: pytest -m integration
